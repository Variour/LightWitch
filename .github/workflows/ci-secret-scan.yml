name: "CI: scan for secrets"

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  # Only cancel superseded PR runs. Main-branch pushes must always run to
  # completion so every commit actually gets scanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
