name: Refresh CA bundle

on:
  push:
    branches: [main]
    paths: ['requirements.txt']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate CA bundle
        run: python3 scripts/gen_ca_bundle.py src/update/CaBundle.h

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet -- src/update/CaBundle.h && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B chore/refresh-ca-bundle
          git add src/update/CaBundle.h
          git commit -m 'ota: refresh CA bundle'
          git push --force -u origin chore/refresh-ca-bundle

          if ! gh pr view chore/refresh-ca-bundle --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create \
              --base main \
              --head chore/refresh-ca-bundle \
              --title 'ota: refresh CA bundle' \
              --body 'Automated refresh of `src/update/CaBundle.h` from the current `certifi` root-CA store (`scripts/gen_ca_bundle.py`).'
          fi
