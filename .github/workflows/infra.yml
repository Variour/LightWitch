name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        env:
          GHCR_PASSWORD_B64:             ${{ secrets.GHCR_PASSWORD_B64 }}
          GITHUB_OAUTH_CLIENT_ID:        ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET:    ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          ALLOWED_GITHUB_USERS:          ${{ secrets.ALLOWED_GITHUB_USERS }}
          AUTH_TOKEN_SECRET:             ${{ secrets.AUTH_TOKEN_SECRET }}
          AUTH_SESSION_SECRET:           ${{ secrets.AUTH_SESSION_SECRET }}
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --mode Incremental
