name: Firmware build and release

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'PlatformIO environments to build (comma-separated)'
        default: 'esp32dev,esp32c3,esp32s3'
        required: true
  pull_request:
    paths:
      - 'platformio.ini'
      - 'partitions.csv'
      - 'requirements.txt'
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/firmware.yml'

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      firmware_changed: ${{ steps.filter.outputs.firmware }}
    steps:
      - id: matrix
        run: |
          ENVIRONMENTS="${{ github.event_name == 'pull_request' && 'esp32dev' || github.event.inputs.environments || 'esp32dev,esp32c3,esp32s3' }}"
          JSON=$(echo "$ENVIRONMENTS" \
            | tr ',' '\n' | sed 's/[[:space:]]//g' | jq -R . | jq -sc .)
          echo "value={\"env\":${JSON}}" >> "$GITHUB_OUTPUT"

      - id: version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          VERSION="${DATE}.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            firmware:
              - 'platformio.ini'
              - 'partitions.csv'
              - 'requirements.txt'
              - 'src/**'
              - 'include/**'
              - 'lib/**'
              - 'scripts/**'
              - '.github/workflows/firmware.yml'

  build:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.firmware_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Inject version into version.cpp
        run: |
          sed -i 's/const char\* FW_VERSION = ".*";/const char* FW_VERSION = "${{ needs.setup.outputs.version }}";/' src/version.cpp

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
            .pio/build/${{ matrix.env }}
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'src/**', 'include/**', 'lib/**') }}
          restore-keys: |
            pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}-
            pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin

  build-fs:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-esp32dev-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-esp32dev-

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Gzip web assets
        run: |
          shopt -s nullglob
          for f in data/*.html data/*.css data/*.js data/*.svg data/*.txt; do
            gzip -9 -c "$f" > "${f}.gz" && rm "$f" && echo "Compressed: $f"
          done

      - name: Build filesystem image
        run: pio run -e esp32dev -t buildfs

      - uses: actions/upload-artifact@v7
        with:
          name: littlefs
          path: .pio/build/esp32dev/littlefs.bin

  release:
    if: github.ref == 'refs/heads/main'
    needs: [setup, build, build-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          for f in artifacts/firmware-*/firmware.bin; do
            env=$(echo "$f" | sed 's|artifacts/firmware-\(.*\)/firmware.bin|\1|')
            cp "$f" "firmware-${env}.bin"
            cp "artifacts/firmware-${env}/bootloader.bin" "bootloader-${env}.bin"
          done
          cp artifacts/firmware-esp32dev/partitions.bin partitions.bin
          cp artifacts/littlefs/littlefs.bin littlefs.bin

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: Firmware ${{ needs.setup.outputs.version }}
          files: |
            firmware-*.bin
            bootloader-*.bin
            partitions.bin
            littlefs.bin
          generate_release_notes: true
