name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.1.18
        with:
          configurationFile: renovate.json
          token: '${{ secrets.GITHUB_TOKEN }}'
