name: "Web: deploy"

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'data/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-deploy.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'data/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-deploy.yml'

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Skipped for fork PRs: no Azure deploy for arbitrary external PRs.
      - uses: azure/login@v3
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── main branch: update the permanent latest app ────────────────────────
      - name: Update latest Container App
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          IMAGE="${IMAGE,,}"
          az containerapp revision copy \
            --name batterylight-latest \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --revision-suffix "${GITHUB_SHA::7}"

      # ── PR: create or update a per-PR Container App ─────────────────────────
      - name: Deploy PR Container App
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: pr_app
        run: |
          APP="batterylight-pr-${{ github.event.number }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          IMAGE="ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}"
          IMAGE="${IMAGE,,}"  # lowercase

          # Retrieve the shared environment ID and prod FQDN from the permanent app
          ENV_ID=$(az containerapp show \
            --name batterylight-latest \
            --resource-group "$RG" \
            --query "properties.environmentId" -o tsv)

          PROD_FQDN=$(az containerapp show \
            --name batterylight-latest \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          if az containerapp show --name "$APP" --resource-group "$RG" &>/dev/null; then
            az containerapp revision copy \
              --name "$APP" \
              --resource-group "$RG" \
              --revision-suffix "${GITHUB_SHA::7}"
          else
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment "$ENV_ID" \
              --image "$IMAGE" \
              --registry-server ghcr.io \
              --registry-username variour \
              --registry-password "${{ secrets.GHCR_PASSWORD_B64 }}" \
              --target-port 8080 \
              --ingress external \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 0 \
              --max-replicas 3 \
              --env-vars \
                AUTH_ORIGIN="https://$PROD_FQDN" \
                ALLOWED_GITHUB_USERS="${{ secrets.ALLOWED_GITHUB_USERS }}" \
                TOKEN_SECRET="${{ secrets.AUTH_TOKEN_SECRET }}" \
                SESSION_SECRET="${{ secrets.AUTH_SESSION_SECRET }}"
          fi

          FQDN=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Post preview URL to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- container-preview -->';
            const fqdn = '${{ steps.pr_app.outputs.fqdn }}';
            const body = [
              marker,
              '## Preview',
              '',
              `**URL:** https://${fqdn}`,
              '',
              '_Hosted on Azure Container Apps — accessible from the internet._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── main branch: clean up containers for closed PRs ────────────────────
      - name: Clean up closed PR containers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = context.repo.repo.toLowerCase();

            const { data: ownerData } = await github.rest.users.getByUsername({ username: owner });
            const isOrg = ownerData.type === 'Organization';

            let versions;
            try {
              versions = isOrg
                ? (await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                    org: owner, package_type: 'container', package_name: packageName,
                  })).data
                : (await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                    username: owner, package_type: 'container', package_name: packageName,
                  })).data;
            } catch (e) {
              console.log('Could not list package versions:', e.message);
              return;
            }

            const closedPrNumbers = [];

            for (const version of versions) {
              const prTags = (version.metadata?.container?.tags ?? [])
                .filter(t => /^pr-\d+$/.test(t));
              if (!prTags.length) continue;

              for (const tag of prTags) {
                const prNumber = parseInt(tag.slice(3), 10);
                let prState;
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    ...context.repo, pull_number: prNumber,
                  });
                  prState = pr.state;
                } catch (e) {
                  prState = e.status === 404 ? 'not found' : null;
                }

                if (prState === 'open' || prState === null) continue;

                console.log(`Deleting registry package ${tag} (PR #${prNumber} is ${prState})`);
                try {
                  if (isOrg) {
                    await github.rest.packages.deletePackageVersionForOrg({
                      org: owner, package_type: 'container',
                      package_name: packageName, package_version_id: version.id,
                    });
                  } else {
                    await github.rest.packages.deletePackageVersionForUser({
                      username: owner, package_type: 'container',
                      package_name: packageName, package_version_id: version.id,
                    });
                  }
                  closedPrNumbers.push(prNumber);
                } catch (e) {
                  console.log(`Failed to delete ${tag}:`, e.message);
                }
              }
            }
            core.exportVariable('CLOSED_PRS', closedPrNumbers.join(' '));

      - name: Delete Azure Container Apps for closed PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOSED_PRS != ''
        run: |
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          for PR in $CLOSED_PRS; do
            APP="batterylight-pr-${PR}"
            if az containerapp show --name "$APP" --resource-group "$RG" &>/dev/null; then
              echo "Deleting Container App $APP"
              az containerapp delete --name "$APP" --resource-group "$RG" --yes
            fi
          done
