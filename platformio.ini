[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.11.1
    esp32async/AsyncTCP @ ^3.4.10
    ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.9.0
    knolleary/PubSubClient @ ^2.8

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

extra_scripts =
    pre:scripts/pre_uploadfs.py
    post:scripts/patch_mklittlefs.py
    post:scripts/upload_ota_all.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DLED_DATA_PIN=25
    -DLED_CLOCK_PIN=26
    -DWIFI_TX_POWER=WIFI_POWER_19_5dBm

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32c3
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.11.1
    esp32async/AsyncTCP @ ^3.4.10
    ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.9.0
    knolleary/PubSubClient @ ^2.8

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

extra_scripts =
    pre:scripts/pre_uploadfs.py
    post:scripts/patch_mklittlefs.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DLED_DATA_PIN=20
    -DLED_CLOCK_PIN=21
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWIFI_TX_POWER=WIFI_POWER_8_5dBm

; ── OTA targets ───────────────────────────────────────────────────────────────

[env:batterylight1_ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = batterylight1.local

[env:batterylight2_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = batterylight2.local

[env:batterylight3_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = batterylight3.local
